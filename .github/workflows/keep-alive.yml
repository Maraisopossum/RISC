name: Garder Supabase actif

# Le palier gratuit Supabase met un projet en pause après 7 jours sans
# activité. Une petite requête tous les 3 jours suffit à l'éviter.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/items?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Statut HTTP : $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Ping Supabase a échoué (statut $status)"
            exit 1
          fi
